name: room-thermostat-shadow

services:
  room-climate-shadow:
    image: ghcr.io/home-assistant/home-assistant:2026.11.3
    entrypoint: ["/usr/local/bin/python", "-u", "/opt/shadow/service.py"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 160m
    pids_limit: 32
    environment:
      TZ: Asia/Tokyo
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./shadow:/opt/shadow:ro
      - ./config:/ha-readonly:ro
      - ./shadow-data:/data
      - ./pilot-data:/pilot:ro
      - ../outputs/climate-shadow:/output
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
